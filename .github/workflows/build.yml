name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-main
  cancel-in-progress: true

env:
  MAVEN_ARGS: -B -q -T1C -Daether.connector.basic.downstreamThreads=128

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # composite action: checkout + JDK + maven cache + maven install (from Maven Central)
      - name: Setup Maven Action
        uses: s4u/setup-maven-action@v1.21.0
        with:
          maven-version: '3.9.16'
          java-version: '21'
          java-distribution: temurin

      - name: Build
        run: mvn ${MAVEN_ARGS} verify