name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-main
  cancel-in-progress: true

env:
  MAVEN_ARGS: -B -q -T1C -Daether.connector.basic.downstreamThreads=128

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      # composite action: checkout + JDK + maven cache + maven install (from Maven Central)
      - name: Setup Maven Action
        # pinned to the merged PR #173 commit (fixes the deprecated setup-java jdkFile input, dropping the warning);
        # base version v1.21.0 - revert to a tag once s4u releases a version containing that fix
        uses: s4u/setup-maven-action@8da9a2c
        with:
          maven-version: '3.9.16'
          java-version: '21'
          java-distribution: temurin

      - name: Build
        run: mvn ${MAVEN_ARGS} verify